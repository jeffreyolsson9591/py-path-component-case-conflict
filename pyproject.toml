[project]
name = "py-path-component-case-conflict"
version = "0.1.0"
description = "Finds files in a directory whose names differ only by letter case, risking data loss across filesystems."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
